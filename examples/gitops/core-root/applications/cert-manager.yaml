apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-20"
        bareplane.io/cluster: lab
        bareplane.io/component: cert-manager
    name: lab-cert-manager
    namespace: argocd
spec:
    destination:
        namespace: cert-manager
        server: https://kubernetes.default.svc
    ignoreDifferences:
        - group: admissionregistration.k8s.io
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
          kind: MutatingWebhookConfiguration
          name: cert-manager-webhook
        - group: admissionregistration.k8s.io
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
          kind: ValidatingWebhookConfiguration
          name: cert-manager-webhook
    project: default
    source:
        path: components/cert-manager
        repoURL: https://github.com/dipeshbabu/bareplane.git
        targetRevision: main
    syncPolicy:
        automated:
            allowEmpty: false
            prune: false
            selfHeal: false
        retry:
            backoff:
                duration: 5s
                maxDuration: 1m
            limit: 5
        syncOptions:
            - ServerSideApply=true
            - FailOnSharedResource=true
            - DisableClientSideApplyMigration=true
            - RespectIgnoreDifferences=true
