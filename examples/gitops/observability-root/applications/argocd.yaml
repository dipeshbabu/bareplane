apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-30"
        bareplane.io/cluster: lab
        bareplane.io/component: argocd
    name: lab-argocd
    namespace: argocd
spec:
    destination:
        namespace: argocd
        server: https://kubernetes.default.svc
    ignoreDifferences:
        - group: '*'
          jsonPointers:
            - /metadata/annotations/bareplane.io~1installation
          kind: '*'
    project: default
    source:
        path: components/argocd
        repoURL: https://github.com/dipeshbabu/bareplane.git
        targetRevision: main
    syncPolicy:
        automated:
            allowEmpty: false
            prune: false
            selfHeal: false
        retry:
            backoff:
                duration: 5s
                maxDuration: 1m
            limit: 5
        syncOptions:
            - ServerSideApply=true
            - FailOnSharedResource=true
            - DisableClientSideApplyMigration=true
            - RespectIgnoreDifferences=true
