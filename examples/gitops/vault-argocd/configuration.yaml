apiVersion: v1
data:
    application.resourceTrackingMethod: annotation
    exec.enabled: "false"
    resource.customizations.health.argoproj.io_Application: |
        local result = {status = "Progressing", message = "Waiting for child synchronization and health"}
        local state = obj.status
        if state == nil then return result end
        if state.conditions ~= nil then
          for _, condition in ipairs(state.conditions) do
            if condition.type == "ComparisonError" or condition.type == "InvalidSpecError" or condition.type == "SyncError" then
              return {status = "Degraded", message = "Child Application reports a reconciliation error"}
            end
          end
        end
        if state.operationState ~= nil and (state.operationState.phase == "Error" or state.operationState.phase == "Failed") then
          return {status = "Degraded", message = "Child Application synchronization failed"}
        end
        if state.operationState ~= nil and (state.operationState.phase == "Running" or state.operationState.phase == "Terminating") then
          return result
        end
        if state.health ~= nil and state.health.status == "Degraded" then
          return {status = "Degraded", message = "Child resources are degraded"}
        end
        if state.sync ~= nil and state.sync.status == "Synced" and state.health ~= nil and state.health.status == "Healthy" then
          local compared = state.sync.comparedTo
          if compared == nil or compared.source == nil or obj.spec == nil or obj.spec.source == nil then return result end
          local actual, desired = compared.source, obj.spec.source
          if actual.repoURL ~= desired.repoURL or actual.targetRevision ~= desired.targetRevision or actual.path ~= desired.path then return result end
          return {status = "Healthy", message = "Child Application is synchronized and healthy"}
        end
        return result
    resource.customizations.health.external-secrets.io_ExternalSecret: |
        local status = obj.status or {}
        for _, condition in ipairs(status.conditions or {}) do
          if condition.type == "Ready" then
            if condition.status == "False" then return {status = "Degraded", message = "Vault Secret synchronization is unavailable; retained data is unchanged"} end
            if condition.status == "True" then
              local observed = (obj.metadata or {}).generation
              local generation = tostring(observed or "")
              local synced = status.syncedResourceVersion
              -- Argo's default health sandbox has no string library. The lexical
              -- interval (generation .. "-", generation .. ".") matches a nonempty
              -- hash after the exact generation prefix ('-' immediately precedes '.').
              if type(observed) == "number" and observed >= 1 and type(synced) == "string" and synced > generation .. "-" and synced < generation .. "." and type(status.refreshTime) == "string" and status.refreshTime ~= "" then
                return {status = "Healthy", message = "Vault Secret generation has synchronized"}
              end
            end
          end
        end
        return {status = "Progressing", message = "Waiting for the current Vault Secret generation"}
    resource.customizations.health.external-secrets.io_SecretStore: |
        local status = obj.status or {}
        for _, condition in ipairs(status.conditions or {}) do
          if condition.type == "Ready" then
            if condition.status == "True" then return {status = "Healthy", message = "Vault store authentication is ready"} end
            if condition.status == "False" then return {status = "Degraded", message = "Vault store authentication or trust is unavailable"} end
          end
        end
        return {status = "Progressing", message = "Waiting for Vault store authentication"}
    users.anonymous.enabled: "false"
kind: ConfigMap
metadata:
    name: argocd-cm
    namespace: argocd
