apiVersion: bareplane.io/v1alpha1
kind: BareplaneCluster
metadata:
  name: homelab
spec:
  domain: lab.example.com
  provider:
    type: proxmox
    endpoint: https://proxmox.example.com:8006
    targets:
      - pve1
      - pve2
  nodes:
    - name: control-plane
      role: control-plane
      count: 3
      cpu: 4
      memoryGB: 8
      diskGB: 64
    - name: gpu-workers
      role: worker
      count: 2
      cpu: 16
      memoryGB: 64
      diskGB: 256
      gpu: true
      targets:
        - pve2
  features:
    observability: true
    gpu: true
  profiles:
    - ai
  dns:
    provider: cloudflare
  secrets:
    provider: sops
