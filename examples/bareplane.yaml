apiVersion: bareplane.io/v1alpha1
kind: BareplaneCluster
metadata:
  name: homelab
spec:
  domain: lab.example.com
  provider:
    type: proxmox
    endpoint: https://proxmox.example.com:8006
    targets:
      - pve1
      - pve2
    proxmox:
      bridge: vmbr0
      systemDatastore: local-lvm
      cloudImageFileID: local:import/debian-12-genericcloud-amd64.qcow2
      ssh:
        user: debian
        publicKeyFile: ~/.ssh/id_ed25519.pub
  nodes:
    - name: control-plane
      role: control-plane
      count: 3
      cpu: 4
      memoryGB: 8
      diskGB: 64
    - name: gpu-workers
      role: worker
      count: 2
      cpu: 16
      memoryGB: 64
      diskGB: 256
      gpu: true
      targets:
        - pve2
  bootstrap:
    ssh:
      user: debian
      privateKeyFile: ~/.ssh/id_ed25519
      port: 22
      hosts:
        homelab-control-plane-1: 192.168.1.101
        homelab-control-plane-2: 192.168.1.102
        homelab-control-plane-3: 192.168.1.103
        homelab-gpu-workers-1: 192.168.1.111
        homelab-gpu-workers-2: 192.168.1.112
  kubernetes:
    version: 1.36.4
    apiVIP: 192.168.1.100
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    kubeVIPVersion: 1.2.3
    ciliumVersion: 1.20.1
    kubeProxyReplacement: true
  features:
    observability: true
    gpu: true
  profiles:
    - ai
  dns:
    provider: cloudflare
  secrets:
    provider: sops
