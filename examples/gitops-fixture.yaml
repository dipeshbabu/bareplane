apiVersion: bareplane.io/v1alpha1
kind: BareplaneCluster
metadata:
  name: lab
spec:
  domain: lab.example.com
  provider:
    type: proxmox
    endpoint: https://proxmox.example.com:8006
  nodes:
    - name: control
      role: control-plane
      count: 1
      cpu: 2
      memoryGB: 4
      diskGB: 24
  gitops:
    repoURL: https://github.com/dipeshbabu/bareplane.git
    revision: main
    rootPath: examples/gitops/root
  features:
    observability: false
    gpu: false
  profiles: [minimal]
  components:
    disabled: [metrics-server, cert-manager, observability, external-dns, storage, secrets-sops, vault]
  dns:
    provider: manual
  secrets:
    provider: sops
