# Prometheus 3.14.0 (d7598b7141418fa35be2b5ec5d0fefb634199610); kube-state-metrics 2.20.0 (4ffeda2ef866b0fef372849825a803296483b336).
# Curated by hack/vendor_observability.py; Apache-2.0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bareplane-prometheus
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: bareplane-prometheus
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bareplane-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bareplane-prometheus
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: bareplane-prometheus
  template:
    metadata:
      labels: *id001
      annotations:
        bareplane.io/config-sha256: 6c02f73b32ff6f80b87eca110798cb5325255454d73a57ca7c698b69ae0d793e
    spec:
      serviceAccountName: bareplane-prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: configuration
        configMap:
          name: bareplane-prometheus
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v3.14.0
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --query.max-concurrency=4
        - --query.max-samples=500000
        - --query.timeout=30s
        - --storage.tsdb.wal-compression
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 512Mi
            ephemeral-storage: 3Gi
        volumeMounts:
        - name: configuration
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        ports:
        - name: http
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
