# Prometheus 3.14.0 (d7598b7141418fa35be2b5ec5d0fefb634199610); kube-state-metrics 2.20.0 (4ffeda2ef866b0fef372849825a803296483b336).
# Curated by hack/vendor_observability.py; Apache-2.0.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-30'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: kube-state-metrics
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/version: 2.20.0
    spec:
      automountServiceAccountToken: true
      containers:
      - image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        livenessProbe:
          httpGet:
            path: /livez
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 5
        name: kube-state-metrics
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8081
          name: telemetry
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        args:
        - --resources=nodes,pods,namespaces,deployments
        - --metric-allowlist=kube_node_status_condition,kube_pod_status_phase,kube_pod_container_status_restarts_total,kube_pod_container_status_waiting_reason,kube_deployment_spec_replicas,kube_deployment_status_replicas_available,kube_namespace_status_phase
        - --host=0.0.0.0
        - --telemetry-host=0.0.0.0
        - --server-read-timeout=10s
        - --server-write-timeout=10s
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: kube-state-metrics
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: bareplane-kube-state-metrics
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: bareplane-kube-state-metrics
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bareplane-kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: observability
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: kube-state-metrics
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: kube-state-metrics
  namespace: observability
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: observability
    argocd.argoproj.io/sync-wave: '-10'
spec:
  ports:
  - name: http-metrics
    port: 8080
    targetPort: http-metrics
  selector:
    app.kubernetes.io/name: kube-state-metrics
  type: ClusterIP
