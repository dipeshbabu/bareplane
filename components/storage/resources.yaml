allowVolumeExpansion: false
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    bareplane.io/cluster: lab
    bareplane.io/component: storage
  name: bareplane-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    bareplane.io/cluster: lab
    bareplane.io/component: storage
  name: local-check-94642b64679ab90a352602faeb053a86
  namespace: local-storage
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bareplane-storage-check
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - lab
            - first
            - lab-control-1
            - "1"
          command:
            - /usr/local/bin/python3
            - -I
            - -B
            - /check/check.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: python:3.12.14-slim-bookworm
          imagePullPolicy: IfNotPresent
          name: check
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /host
              name: host
              readOnly: true
              recursiveReadOnly: Enabled
            - mountPath: /check
              name: check
              readOnly: true
      nodeName: lab-control-1
      restartPolicy: Never
      securityContext:
        runAsGroup: 0
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: bareplane-storage-check
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - hostPath:
            path: /
            type: Directory
          name: host
        - configMap:
            name: bareplane-storage-check
          name: check
---
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    bareplane.io/cluster: lab
    bareplane.io/component: storage
  labels:
    bareplane.io/local-volume: first
  name: bareplane-local-c98337fb29a579369c6b5f293bdd144a
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  local:
    path: /var/lib/bareplane/local-volumes/lab/first/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lab-control-1
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bareplane-local
  volumeMode: Filesystem
