apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - upstream.yaml
patches:
  - path: configuration.yaml
  - path: parameters.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment|StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
