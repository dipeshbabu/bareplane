apiVersion: v1
kind: Namespace
metadata:
  name: vault-secrets
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    argocd.argoproj.io/sync-wave: '-30'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bareplane-vault
  namespace: vault-secrets
  labels:
    helm.sh/chart: external-secrets-2.10.0
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: bareplane-vault
    app.kubernetes.io/version: v2.10.0
    app.kubernetes.io/managed-by: Helm
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    argocd.argoproj.io/sync-wave: '-10'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bareplane-vault-reader
  namespace: "vault-workloads"
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    bareplane.io/existing-namespace: "vault-workloads"
    argocd.argoproj.io/sync-wave: '-10'
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bareplane-vault-leader
  namespace: vault-secrets
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - bareplane-vault
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bareplane-vault-leader
  namespace: vault-secrets
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    argocd.argoproj.io/sync-wave: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bareplane-vault-leader
subjects:
  - kind: ServiceAccount
    name: bareplane-vault
    namespace: vault-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bareplane-vault-controller
  namespace: "vault-workloads"
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    bareplane.io/existing-namespace: "vault-workloads"
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - secretstores
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets/status
      - secretstores/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - generators.external-secrets.io
    resources:
      - generatorstates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - serviceaccounts/token
    resourceNames:
      - bareplane-vault-reader
    verbs:
      - create
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bareplane-vault-controller
  namespace: "vault-workloads"
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    bareplane.io/existing-namespace: "vault-workloads"
    argocd.argoproj.io/sync-wave: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bareplane-vault-controller
subjects:
  - kind: ServiceAccount
    name: bareplane-vault
    namespace: vault-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bareplane-vault
  namespace: vault-secrets
  labels:
    helm.sh/chart: external-secrets-2.10.0
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: bareplane-vault
    app.kubernetes.io/version: v2.10.0
    app.kubernetes.io/managed-by: Helm
  annotations:
    bareplane.io/cluster: lab
    bareplane.io/component: vault
    argocd.argoproj.io/sync-wave: '-10'
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: bareplane-vault
  template:
    metadata:
      labels:
        helm.sh/chart: external-secrets-2.10.0
        app.kubernetes.io/name: external-secrets
        app.kubernetes.io/instance: bareplane-vault
        app.kubernetes.io/version: v2.10.0
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: bareplane-vault
      automountServiceAccountToken: true
      hostNetwork: false
      containers:
        - name: external-secrets
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/external-secrets/external-secrets:v2.10.0
          imagePullPolicy: IfNotPresent
          args:
            - "--namespace=vault-workloads"
            - "--controller-class=bareplane-vault-0211c0b95605588858fe2776876f09db"
            - --enable-leader-election=true
            - --leader-election-id=bareplane-vault
            - --enable-cluster-store-reconciler=false
            - --enable-cluster-external-secret-reconciler=false
            - --enable-cluster-push-secret-reconciler=false
            - --enable-push-secret-reconciler=false
            - --enable-secret-store-reconciler=true
            - --enable-generator-state=false
            - --unsafe-allow-generic-targets=false
            - --enable-secrets-caching=false
            - --enable-managed-secrets-caching=false
            - --enable-configmaps-caching=false
            - --enable-vault-token-cache=false
            - --store-requeue-interval=30s
            - --concurrent=1
            - --client-qps=10
            - --client-burst=20
            - --metrics-addr=127.0.0.1:8080
            - --live-addr=:8082
            - --loglevel=info
            - --zap-time-encoding=iso8601
          ports:
            - name: live
              containerPort: 8082
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: live
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: live
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux
  strategy:
    type: Recreate
