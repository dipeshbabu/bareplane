name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    name: v0.1 acceptance
    if: always()
    needs: [quality, host-prepare, join-topology]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every automated acceptance dependency
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_acceptance_gate.py

  join-topology:
    name: "${{ matrix.mode == 'vault' && 'Core Vault VM' || matrix.mode == 'sops' && 'Core SOPS VM' || matrix.mode == 'external-dns' && 'Core DNS VM' || matrix.mode == 'metrics-server' && 'Core Metrics Server VM' || matrix.mode == 'kubelet-tls' && 'Kubelet serving TLS VMs' || matrix.mode == 'cert-manager' && 'Core cert-manager VM' || matrix.mode == 'handoff' && 'GitOps handoff VM' || matrix.mode == 'argocd' && 'Argo installation VM' || matrix.mode == 'recovery' && 'Bootstrap recovery VM' || matrix.mode == 'apply' && 'Bootstrap apply VMs' || 'Multi-node join VMs' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [phases, apply, recovery, argocd, handoff, cert-manager, kubelet-tls, metrics-server, external-dns, sops, vault]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable KVM test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          python -m pip install ansible-core==2.19.9
          go build -o bin/bareplane ./cmd/bareplane
      - name: Install the checksum-pinned controller kubectl for health checks
        run: |
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl"
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Join three control planes and a worker, refuse foreign state, and reapply
        env:
          BAREPLANE_DISPOSABLE_VM: '1'
          BAREPLANE_TEST_BOOTSTRAP_APPLY: "${{ matrix.mode != 'phases' && '1' || '0' }}"
          BAREPLANE_TEST_BOOTSTRAP_RECOVERY: "${{ matrix.mode == 'recovery' && '1' || '0' }}"
          BAREPLANE_TEST_ARGOCD_INSTALL: "${{ matrix.mode == 'argocd' && '1' || '0' }}"
          BAREPLANE_TEST_GITOPS_HANDOFF: "${{ matrix.mode == 'handoff' && '1' || '0' }}"
          BAREPLANE_TEST_CERT_MANAGER: "${{ matrix.mode == 'cert-manager' && '1' || '0' }}"
          BAREPLANE_TEST_KUBELET_TLS: "${{ matrix.mode == 'kubelet-tls' && '1' || '0' }}"
          BAREPLANE_TEST_METRICS_SERVER: "${{ matrix.mode == 'metrics-server' && '1' || '0' }}"
          BAREPLANE_TEST_EXTERNAL_DNS: "${{ matrix.mode == 'external-dns' && '1' || '0' }}"
          BAREPLANE_TEST_SOPS_DELIVERY: "${{ matrix.mode == 'sops' && '1' || '0' }}"
          BAREPLANE_TEST_VAULT: "${{ matrix.mode == 'vault' && '1' || '0' }}"
          BAREPLANE_TEST_GIT_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
          BAREPLANE_TEST_GIT_REPO: "${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}"
        run: |
          if [ "$BAREPLANE_TEST_SOPS_DELIVERY" = 1 ]; then
            python hack/install_sops_test_tools.py "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          python tests/ansible/join_topology_vm.py

  host-prepare:
    name: Host preparation VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the embedded bundle renderer
        run: go build -o bin/bareplane ./cmd/bareplane
      - name: Apply twice inside a disposable Debian 12 guest
        uses: vmactions/debian-vm@389ba1da28ff5b440cba52db8e03fc2e08e2affa # v1.0.0
        with:
          release: '12'
          mem: 4096
          copyback: false
          prepare: |
            apt-get update
            apt-get install -y python3-venv python3-apt sudo ca-certificates
            python3 -m venv /opt/ansible
            /opt/ansible/bin/python -m pip install ansible-core==2.19.9
          run: |
            BAREPLANE_DISPOSABLE_VM=1 sh tests/ansible/host_prepare_vm.sh

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Exercise mocked complete v0.1 lifecycle and failure recovery
        run: go test -count=1 -v ./internal/cli -run TestAcceptanceMockedLifecycle

      - name: Build
        run: go build ./...

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Set up Python for Ansible validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Ansible core
        run: python -m pip install ansible-core==2.19.9

      - name: Validate generated Ansible bundle
        env:
          BAREPLANE_TEST_ANSIBLE: '1'
        run: |
          go test -count=1 -v ./internal/render/ansible -run TestBundleAnsibleIntegration
          go test -count=1 -v ./internal/bootstrapapply -run 'TestControlled.*Integration'

      - name: Test VIP interface and conflict detection
        env:
          BAREPLANE_TEST_PUBLIC_GIT: '1'
          BAREPLANE_TEST_SOPS: '1'
        run: |
          python hack/install_sops_test_tools.py "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP:$PATH"
          python -m unittest discover -s tests/ansible -p 'test_*.py'

      - name: Test concurrent branch cleanup with isolated Git repositories
        run: python -m unittest discover -s tests/github -p 'test_*.py'

      - name: Validate deterministic GitOps export and Kubernetes/Argo schemas
        run: |
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lupa==2.6
          go build -o bin/bareplane ./cmd/bareplane
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl"
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kubectl"
          python tests/gitops/validate.py bin/bareplane "$RUNNER_TEMP/kubectl"

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH).reject { |f| f.include?("/.git/") }.each { |f| YAML.load_file(f, aliases: true) }'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Validate saved-plan apply command shape
        run: |
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          mkdir -p "$workdir/config" "$workdir/state" "$workdir/data"
          cat > "$workdir/config/main.tf" <<'EOF'
          resource "terraform_data" "smoke" {
            input = "bareplane-saved-plan-smoke"
          }
          EOF
          TF_DATA_DIR="$workdir/data" terraform -chdir="$workdir/config" init -backend=false -input=false -no-color
          TF_DATA_DIR="$workdir/data" terraform -chdir="$workdir/config" plan \
            -input=false \
            -no-color \
            -state="$workdir/state/terraform.tfstate" \
            -out="$workdir/state/terraform.tfplan"
          TF_DATA_DIR="$workdir/data" terraform -chdir="$workdir/config" apply \
            -input=false \
            -no-color \
            -auto-approve \
            -state="$workdir/state/terraform.tfstate" \
            -state-out="$workdir/state/terraform.tfstate" \
            -backup="$workdir/state/terraform.tfstate.backup" \
            "$workdir/state/terraform.tfplan"
          test -f "$workdir/state/terraform.tfstate"

      - name: Validate generated Terraform
        run: |
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          go build -o "$workdir/bareplane" ./cmd/bareplane
          printf '%s\n' 'ssh-ed25519 dGVzdA== ci-test' > "$workdir/id_ed25519.pub"
          cat > "$workdir/bareplane.yaml" <<'EOF'
          apiVersion: bareplane.io/v1alpha1
          kind: BareplaneCluster
          metadata:
            name: ci
          spec:
            domain: ci.example.com
            provider:
              type: proxmox
              endpoint: https://proxmox.example.com:8006
              targets:
                - pve1
              proxmox:
                bridge: vmbr0
                systemDatastore: local-lvm
                cloudImageFileID: local:import/debian.qcow2
                ssh:
                  user: debian
                  publicKeyFile: id_ed25519.pub
            nodes:
              - name: control
                role: control-plane
                count: 1
                cpu: 4
                memoryGB: 8
                diskGB: 64
            features:
              observability: true
              gpu: false
            profiles:
              - minimal
            dns:
              provider: manual
            secrets:
              provider: sops
          EOF
          "$workdir/bareplane" render "$workdir/bareplane.yaml"
          terraform -chdir="$workdir/.bareplane/terraform" init -backend=false -input=false
          terraform -chdir="$workdir/.bareplane/terraform" validate
