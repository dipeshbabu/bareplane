name: Verified release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact default-branch source SHA; must match this dispatch commit
        required: true
        type: string
      version:
        description: MAJOR.MINOR.PATCH or a numbered alpha/beta/rc prerelease
        required: true
        type: string
      publish:
        description: Request publication only with genuine evidence and release-environment approval
        required: true
        type: boolean
        default: false
      operator_evidence:
        description: Bounded sanitized operator evidence JSON, required only when publishing
        required: false
        type: string

concurrency:
  group: bareplane-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact-source release policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      version: ${{ steps.policy.outputs.version }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_OPERATOR_EVIDENCE: ${{ inputs.operator_evidence }}
        run: python .github/scripts/release_policy.py

  build:
    name: Build and attest reviewed candidate
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .release-go-version
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - name: Build and verify the complete candidate
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python hack/release_artifacts.py build --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/candidate"
          python hack/release_schema.py "$RUNNER_TEMP/candidate"
          python hack/release_smoke.py "$RUNNER_TEMP/candidate"
      - name: Sign build provenance with the trusted GitHub workflow identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/candidate/*
      - name: Bind the validated SPDX inventory to every platform archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/candidate/*.tar.gz
          sbom-path: ${{ runner.temp }}/candidate/bareplane_${{ needs.verify.outputs.version }}.spdx.json
      - name: Retain the verified candidate without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-release-candidate
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish only after operator and environment approval
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, build]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      deployments: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python hack/release_schema.py "$RUNNER_TEMP/candidate"
      - name: Recheck CI, operator evidence, signatures, tag and uploaded digests
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_OPERATOR_EVIDENCE: ${{ inputs.operator_evidence }}
        run: python hack/publish_release.py "$RUNNER_TEMP/candidate"
