name: Cleanup merged branches

on:
  pull_request_target:
    types:
      - closed
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Clean unchanged merged branches
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target must never execute the pull request's head code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete only refs matching the exact merged head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/cleanup_merged_branches.py
