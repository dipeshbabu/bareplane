---
- name: Refuse kubeconfig retrieval for a partial disposable topology
  hosts: control_plane
  connection: local
  gather_facts: false
  vars:
    bareplane_cluster: lab
    bareplane_control_planes: [localhost]
    bareplane_workers: [missing-worker]
    bareplane_primary_control_plane: localhost
    bareplane_kubernetes_version: '1.36.4'
    bareplane_api_vip: 192.0.2.100
    bareplane_api_port: 6443
  tasks:
    - name: Require disposable VM context
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BAREPLANE_DISPOSABLE_VM') == '1'
    - name: Require the formation gate to refuse the incomplete topology
      block:
        - name: Attempt retrieval while a desired node is missing
          ansible.builtin.include_role:
            name: kubeconfig
        - name: Reject unexpected retrieval success
          ansible.builtin.fail:
            msg: Partial topology unexpectedly passed kubeconfig retrieval.
      rescue:
        - name: Require the topology-specific refusal
          ansible.builtin.assert:
            that: ansible_failed_result.msg == 'The live Kubernetes topology does not match the desired Bareplane machines.'
    - name: Check no local credential was published
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/../state/bootstrap/admin.conf"
      register: partial_export
    - name: Require no credential after failed formation
      ansible.builtin.assert:
        that: not partial_export.stat.exists
