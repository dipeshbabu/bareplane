---
- name: Initialize and inspect the disposable primary node
  hosts: control_plane
  connection: local
  gather_facts: false
  vars:
    bareplane_cluster: lab
    bareplane_primary_control_plane: localhost
    bareplane_api_vip: 192.0.2.100
    bareplane_api_port: 6443
    bareplane_kube_vip_version: '1.2.3'
    bareplane_kubernetes_version: '1.36.4'
    bareplane_kube_proxy_replacement: true
    bareplane_pod_cidr: 10.244.0.0/16
    bareplane_service_cidr: 10.96.0.0/12
  pre_tasks:
    - name: Require disposable VM context
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BAREPLANE_DISPOSABLE_VM') == '1'
  roles: [control_plane_init]
  tasks:
    - name: Read the registered node
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=5s get nodes -o json
      changed_when: false
      register: primary_nodes
    - name: Require a registered primary node
      ansible.builtin.assert:
        that: (primary_nodes.stdout | from_json)['items'] | length == 1
    - name: Check kube-proxy is absent
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=5s -n kube-system get daemonset kube-proxy --ignore-not-found -o name
      changed_when: false
      register: proxy_daemonset
    - name: Require kube-proxy replacement remains exclusive
      ansible.builtin.assert:
        that: proxy_daemonset.stdout == ''
    - name: Inspect private bootstrap output permissions
      ansible.builtin.stat:
        path: /var/lib/bareplane/bootstrap/init-output
      register: private_output
    - name: Require private and bounded bootstrap output
      ansible.builtin.assert:
        that:
          - private_output.stat.mode == '0600'
          - private_output.stat.size <= 1048576
