---
- name: Retrieve the disposable cluster kubeconfig into private controller state
  hosts: control_plane
  connection: local
  gather_facts: false
  vars:
    bareplane_cluster: lab
    bareplane_control_planes: [localhost]
    bareplane_workers: []
    bareplane_primary_control_plane: localhost
    bareplane_kubernetes_version: '1.36.4'
    bareplane_api_vip: 192.0.2.100
    bareplane_api_port: 6443
  pre_tasks:
    - name: Require disposable VM context
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BAREPLANE_DISPOSABLE_VM') == '1'
  roles: [kubeconfig]
  tasks:
    - name: Authenticate through the VIP using the exported credential
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ inventory_dir }}/../state/bootstrap/admin.conf", --request-timeout=5s, get, --raw=/readyz]
      changed_when: false
    - name: Inspect the local exported credential without reading its contents
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/../state/bootstrap/admin.conf"
        get_checksum: false
      register: exported_config
    - name: Require a private canonical kubeconfig
      ansible.builtin.assert:
        that:
          - exported_config.stat.isreg
          - exported_config.stat.mode == '0600'
