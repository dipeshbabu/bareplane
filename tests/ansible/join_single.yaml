---
- name: Verify the single-node join phase is a credential-free no-op
  hosts: control_plane
  connection: local
  gather_facts: false
  vars:
    bareplane_cluster: lab
    bareplane_control_planes: [localhost]
    bareplane_workers: []
    bareplane_kubernetes_version: '1.36.4'
  pre_tasks:
    - name: Require disposable VM context
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BAREPLANE_DISPOSABLE_VM') == '1'
    - name: Snapshot bootstrap tokens without exposing their values
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=5s -n kube-system get secrets --field-selector=type=bootstrap.kubernetes.io/token -o name
      changed_when: false
      register: tokens_before
  roles: [join_primary, join_topology]
  tasks:
    - name: Read bootstrap token names after the single-node phase
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=5s -n kube-system get secrets --field-selector=type=bootstrap.kubernetes.io/token -o name
      changed_when: false
      register: tokens_after
    - name: Require no new join credentials
      ansible.builtin.assert:
        that: tokens_before.stdout == tokens_after.stdout
