---
- name: Install and verify Cilium in the disposable cluster
  hosts: control_plane
  connection: local
  gather_facts: false
  vars:
    bareplane_cluster: lab
    bareplane_primary_control_plane: localhost
    bareplane_api_vip: 192.0.2.100
    bareplane_api_port: 6443
    bareplane_cilium_version: '1.20.1'
    bareplane_kube_proxy_replacement: true
  pre_tasks:
    - name: Require disposable VM context
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'BAREPLANE_DISPOSABLE_VM') == '1'
  roles: [cilium]
  tasks:
    - name: Verify kube-proxy remains absent
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=5s -n kube-system get daemonset kube-proxy --ignore-not-found -o name
      changed_when: false
      register: cilium_proxy
    - ansible.builtin.assert:
        that: cilium_proxy.stdout == ''
    - name: Read the deployed Cilium values
      ansible.builtin.slurp:
        src: /var/lib/bareplane/bootstrap/cilium-values.yaml
      register: cilium_values
    - name: Require core-only networking options
      ansible.builtin.assert:
        that:
          - (cilium_values.content | b64decode | from_yaml).kubeProxyReplacement
          - not (cilium_values.content | b64decode | from_yaml).hubble.enabled
          - not (cilium_values.content | b64decode | from_yaml).gatewayAPI.enabled
          - not (cilium_values.content | b64decode | from_yaml).bgpControlPlane.enabled
          - not (cilium_values.content | b64decode | from_yaml).l7Proxy
