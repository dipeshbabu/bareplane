    targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: metrics-server
  annotations:
    bareplane.io/cluster: BAREPLANE_CLUSTER_NAME
    bareplane.io/component: metrics-server
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      containers:
      - args:
        - --cert-dir=/tmp
        - --secure-port=10250
        - --kubelet-preferred-address-types=InternalIP
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        - --kubelet-certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - --tls-cert-file=/etc/metrics-server/tls/tls.crt
        - --tls-private-key-file=/etc/metrics-server/tls/tls.key
        image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: metrics-server
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: BAREPLANE_METRICS_CPU
            memory: BAREPLANE_METRICS_MEMORY
          limits:
            memory: BAREPLANE_METRICS_MEMORY_LIMIT
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-dir
        - name: serving-tls
          mountPath: /etc/metrics-server/tls
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      volumes:
      - emptyDir: {}
        name: tmp-dir
      - name: serving-tls
        secret:
          secretName: metrics-server-serving
          defaultMode: 288
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 1000
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: metrics-server/metrics-server-serving
    argocd.argoproj.io/sync-wave: '10'
    bareplane.io/cluster: BAREPLANE_CLUSTER_NAME
    bareplane.io/component: metrics-server
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  service:
    name: metrics-server
    namespace: metrics-server
  version: v1beta1
  versionPriority: 100
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: metrics-server-serving
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    bareplane.io/cluster: BAREPLANE_CLUSTER_NAME
    bareplane.io/component: metrics-server
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: metrics-server-serving
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    bareplane.io/cluster: BAREPLANE_CLUSTER_NAME
    bareplane.io/component: metrics-server
spec:
  secretName: metrics-server-serving
  commonName: metrics-server
  duration: 2160h
  renewBefore: 720h
  dnsNames:
  - metrics-server.metrics-server.svc
  usages:
  - digital signature
  - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: metrics-server-serving
    kind: Issuer
    group: cert-manager.io
