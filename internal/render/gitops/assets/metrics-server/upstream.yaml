apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: metrics-server
  annotations:
    bareplane.io/cluster: BAREPLANE_CLUSTER_NAME
    bareplane.io/component: metrics-server
